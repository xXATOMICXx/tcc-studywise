<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-StudyWise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>💡<span class="azul">Study</span><span class="amarelo">Wise</span></h1>
            <p>Entre na sua conta</p>
            
            <div class="mensagem-erro" id="mensagem-erro"></div>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>
            </div>

            <button class="botao-login" id="botao-login">Entrar</button>

            <div class="links">
                <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
