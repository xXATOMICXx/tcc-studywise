<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro-StudyWise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>💡<span class="azul">Study</span><span class="amarelo">Wise</span></h1>
            <p>Crie sua conta</p>
            
            <div class="mensagem-erro" id="mensagem-erro"></div>
            <div class="mensagem-sucesso" id="mensagem-sucesso"></div>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Seu nome" required>
            </div>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required>
            </div>

            <div class="campo">
                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" placeholder="Digite a senha novamente" required>
            </div>

            <button class="botao-login" id="botao-cadastro">Cadastrar</button>

            <div class="links">
                <p>Já tem conta? <a href="login.html">Fazer login</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
